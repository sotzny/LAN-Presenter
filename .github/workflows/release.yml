name: Release

on:
  push:
    tags: ["v[1-9]*.*.*"]

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Set release version
        shell: pwsh
        run: '"VERSION=$($env:VERSION.TrimStart(''v''))" | Out-File -FilePath $env:GITHUB_ENV -Append'
      - name: Prepare release notes from versionize changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/Test-ReleaseNotes.ps1
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previous = @($releasesJson | ConvertFrom-Json | ForEach-Object { $_ } |
            Where-Object { !$_.draft -and !$_.prerelease -and $_.tag_name -match '^v[1-9]\d*\.\d+\.\d+$' } |
            ForEach-Object { [version]$_.tag_name.TrimStart('v') } |
            Where-Object { $_ -lt [version]$env:VERSION } | Sort-Object -Descending)
          $previousVersion = if ($previous.Count) { $previous[0].ToString() } else { '0.0.0' }
          ./scripts/New-ReleaseNotes.ps1 -Version $env:VERSION -PreviousVersion $previousVersion -Repository $env:GITHUB_REPOSITORY -OutputPath release-notes.md
      - run: dotnet restore BeamerPresenterForLanParties.slnx --locked-mode
      - run: dotnet format BeamerPresenterForLanParties.slnx --verify-no-changes --no-restore
      - run: dotnet build BeamerPresenterForLanParties.slnx -c Release --no-restore -p:Version=$env:VERSION
      - name: Install Chromium for presenter browser tests
        shell: pwsh
        run: pwsh tests/BeamerPresenter.Browser.Tests/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Test with coverage
        run: dotnet test BeamerPresenterForLanParties.slnx -c Release --no-build --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory artifacts/TestResults
      - name: Enforce 80 percent line coverage
        shell: pwsh
        run: ./scripts/Assert-Coverage.ps1 -ResultsDirectory artifacts/TestResults -Threshold 80
      - name: Publish self-contained application
        run: dotnet publish src/BeamerPresenter.App/BeamerPresenter.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish -p:Version=$env:VERSION
      - name: Create portable archive
        shell: pwsh
        run: |
          dotnet publish src/BeamerPresenter.Updater/BeamerPresenter.Updater.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/updater/BeamerPresenter.Updater.exe artifacts/publish/BeamerPresenter.Updater.exe -Force
          ./scripts/New-UpdateManifest.ps1 -PublishDirectory artifacts/publish -Version $env:VERSION
      - name: Package portable archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath "BeamerPresenter-$env:VERSION-win-x64-portable.zip"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" installer\BeamerPresenter.iss'
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "BeamerPresenter-$env:VERSION-win-x64-portable.zip" "artifacts/BeamerPresenter-$env:VERSION-Setup.exe" --verify-tag --title "Beamer Presenter for LAN-Parties $env:VERSION" --notes-file release-notes.md
